    narrative:
      what_it_is: >-
        The commercial follow-on to Shidaowan: six HTR-PM modules driving a
        single large turbine on an inland-adjacent site in Jiangxi.
      why_it_matters: >-
        The test of the central SMR claim, that modularity pays off in series.
        One plant at 650 MWe total but roughly 105 MWe per module, it sits on
        the boundary of the SMR definition and is tracked here on a per-module
        basis, the same convention the IAEA uses.
