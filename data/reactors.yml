  - id: linglong-one-changjiang
    name_en: "Linglong One, Changjiang Unit 1"
    name_zh: "玲龙一号 海南昌江"
    design: "ACP100"
    design_family: "Integral PWR"
    developer_en: "China National Nuclear Corporation"
    developer_zh: "中国核工业集团有限公司"
    developer_type: "State-Owned"
    operator: "Hainan Nuclear Power Co., Ltd."
    site:
      name: "Changjiang Nuclear Power Base"
      province: "Hainan"
      lat: 19.47
      lon: 108.80
    deployment: "Land-based"
    purpose: "Electricity"
    status: "Under Construction"
    output:
      thermal_mwt: 385
      module_mwe: 125
      modules: 1
      plant_mwe: 125
      basis: "design"
    dates:
      announced: "2010-01-01"
      approved: "2019-07-18"
      construction_start: "2021-07-13"
      first_criticality: null
      grid_connection: null
      commercial_operation: null
      expected_commercial_operation: "2026-12-31"
    narrative:
      what_it_is: >-
        A 125 MWe integral pressurised water reactor with the steam generators
        mounted inside the reactor pressure vessel, built as a single unit on
        the existing Changjiang site alongside two large Hualong-class units.
      why_it_matters: >-
        The first land-based commercial SMR to reach concrete anywhere, and the
        reference case for whether an SMR can be built at a cost per kW that
        competes with the large reactors next door to it. Every national SMR
        programme is watching the delivered cost of this one unit.
    milestones:
      - date: "2016-04-01"
        event: "ACP100 design completes an IAEA generic reactor safety review, the first SMR design to do so"
      - date: "2021-07-13"
        event: "First concrete poured at Changjiang"
      - date: "2023-08-10"
        event: "Reactor core module installed"
    verification:
      verified: false
      last_verified: null
      note: "Dates and ratings seeded from memory. Confirm against IAEA PRIS, the ARIS design sheet and CNNC disclosures."
    sources:
      - url: "https://pris.iaea.org/pris/CountryStatistics/CountryDetails.aspx?current=CN"
        title: "IAEA Power Reactor Information System — China country details"
        date: "2026-01-01"
      - url: "https://en.cnnc.com.cn"
        title: "China National Nuclear Corporation — corporate disclosures"
        date: "2026-01-01"

