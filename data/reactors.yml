# China SMR Tracker — source of truth
#
# One entry per reactor project. Every claim carries a source.
# Scope: electricity-generating small modular reactors in mainland China,
# <= 300 MWe per module (IAEA definition). Land-based and floating.
# Out of scope: large reactors (Hualong One, CAP1400), pure district-heating
# reactors (DHR-400 Yanlong, HAPPY200, NHR-200), fast reactors, research-only
# reactors with no electrical output (TMSR-LF1), naval propulsion.
#
# Controlled vocabularies — must match ALLOWED_* in scripts/validate_data.py:
#   status:        Announced | Approved | Under Construction | Commissioning |
#                  Operational | On Hold | Cancelled
#   design_family: Integral PWR | Compact PWR | HTGR | Molten Salt | Other
#   deployment:    Land-based | Floating | Barge-mounted
#   purpose:       Electricity | Cogeneration
#   developer_type: State-Owned | Academic-Industrial | JV | Private
#
# IMPORTANT: every entry below is a SEED, written from general knowledge and
# marked verified: false. Before you publish, replace each landing-page source
# with the specific filing, regulator notice or dated article that supports the
# claim, then set verified: true. The validator refuses to let an entry be
# marked verified while it still cites only a landing page.

