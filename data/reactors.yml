      commercial_operation: "2023-12-06"
      expected_commercial_operation: null
    narrative:
      what_it_is: >-
        Two pebble-bed high-temperature gas-cooled reactor modules of 250 MWt
        each, helium-cooled, feeding a single steam turbine. Fuel is TRISO
        particles in graphite pebbles that circulate through the core.
      why_it_matters: >-
        The only Generation IV reactor in commercial operation anywhere, and the
        proof that a twin-module plant sharing one turbine hall actually works.
        It also sets the realistic clock for first-of-a-kind SMR delivery:
        eleven years from first concrete to commercial operation.
    milestones:
      - date: "2012-12-09"
